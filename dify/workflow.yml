    - data:
        code: "\"\"\"Create source-preserving evidence units from the actual retrieval\
          \ result.\"\"\"\nimport json\nimport re\n\n\ndef build_evidence_units(retrieved):\n\
          \    fragments = []\n    seen = {}\n    for item in retrieved or []:\n \
          \       content = item.get('content', '') if isinstance(item, dict) else\
          \ ''\n        ident = re.search(r'【片段编号】\\s*([^\\s]+)', content)\n     \
          \   q = re.search(r'【题目】第(\\d+)问\\s*(.*)', content)\n        sec = re.search(r'【小节】\\\
          s*(\\d+\\.\\d+)\\s*(.*)', content)\n        pages = re.search(r'【页码】书内第(\\\
          d+)页；PDF第(\\d+)页', content)\n        if not (ident and q and sec and pages):\n\
          \            continue\n        body = content[ident.end():].strip()\n  \
          \      fragment = {'id': ident[1], 'q': q[1], 'sec': sec[1], 'book': int(pages[1]),\
          \ 'pdf': int(pages[2]),\n                    'question_title': q[2].strip(),\
          \ 'section_title': sec[2].strip(), 'body': body}\n        if ident[1] in\
          \ seen:\n            if seen[ident[1]] != fragment:\n                raise\
          \ ValueError('ambiguous_chunk:' + ident[1])\n            continue\n    \
          \    seen[ident[1]] = fragment\n        fragments.append(fragment)\n   \
          \ fragments.sort(key=lambda x: (int(x['q']), tuple(map(int, x['sec'].split('.'))),\
          \ x['book'], x['pdf'], x['id']))\n    units = []\n    previous = None\n\
          \    for fragment in fragments:\n        pieces = [m.group().strip() for\
          \ m in re.finditer(r'.+?(?:[。！？][”’」』]?|$)', fragment['body'], flags=re.S)\
          \ if m.group().strip()]\n        adjacent = (previous is not None and previous['q']\
          \ == fragment['q'] and previous['sec'] == fragment['sec']\n            \
          \        and previous['book'] + 1 == fragment['book'] and previous['pdf']\
          \ + 1 == fragment['pdf'])\n        if pieces and adjacent and units and\
          \ not units[-1]['complete']:\n            # Keep the exact two source pieces;\
          \ do not invent a single-page quote.\n            first = pieces.pop(0)\n\
          \            units[-1]['pieces'].append({'id': fragment['id'], 'quote':\
          \ first})\n            units[-1]['text'] += first\n            units[-1]['complete']\
          \ = bool(re.search(r'[。！？][”’」』]?$', first))\n        for piece in pieces:\n\
          \            units.append({'pieces': [{'id': fragment['id'], 'quote': piece}],\
          \ 'text': piece,\n                          'complete': bool(re.search(r'[。！？][”’」』]?$',\
          \ piece))})\n        previous = fragment\n    for i, unit in enumerate(units):\n\
          \        unit['unit'] = 'E' + str(i + 1).zfill(3)\n    return {'sources':\
          \ {f['id']: {k: f[k] for k in ['q', 'sec', 'book', 'pdf', 'question_title',\
          \ 'section_title']} for f in fragments},\n            'units': units}\n\n\
          \ndef evidence_catalog_text(retrieved):\n    data = build_evidence_units(retrieved)\n\
          \    # Source quotes appear once in this prompt. The model selects unit\
          \ IDs only.\n    readable = {'sources': data['sources'], 'units': [\n  \
          \      {'unit': x['unit'], 'source_ids': [p['id'] for p in x['pieces']],\
          \ 'complete': x['complete'], 'text': x['text']}\n        for x in data['units']]}\n\
          \    return json.dumps(readable, ensure_ascii=False)\n\n\nimport re\nTRADITIONAL\
          \ = '質軟開問頁許協眾變術隱權專閉壟寬業審規碼計錄護風險應選識蹤聲'\n\ndef main(question: str, retrieved:\
          \ list) -> dict:\n    if re.search(r'繁体|繁體|正體', question):\n        traditional\
          \ = True\n    elif re.search(r'简体|簡體', question):\n        traditional =\
          \ False\n    else:\n        traditional = any(c in question for c in TRADITIONAL)\n\
          \    return {'output_script': '繁体中文' if traditional else '简体中文', 'evidence_catalog':\
          \ evidence_catalog_text(retrieved)}"
